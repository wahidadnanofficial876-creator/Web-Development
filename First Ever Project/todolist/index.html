<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-In + To-Do</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- SIGN-UP SCREEN -->
    <div class="container" id="signup-screen">
        <h1>Sign Up</h1>
        <input type="text" id="signup-username" placeholder="Username" required>
        <input type="email" id="signup-email" placeholder="Email" required>
        <input type="password" id="signup-password" placeholder="Password" required>
       <button type="button" id="signup-btn">Sign Up</button>

       

        <p>Already have an account? <span id="show-login" style="cursor:pointer; color:blue;">Sign In</span></p>
        <p class="message" id="signup-message"></p>
    </div>
<!-- LOGIN SCREEN -->
<div class="container" id="login-screen" style="display:none;">
    <h1>Sign In</h1>
    <input type="email" id="login-email" placeholder="Email" required>
    <input type="password" id="login-password" placeholder="Password" required>

    <p style="text-align:right; margin-top:-10px;">
        <span id="forgot-password" style="cursor:pointer; color:blue; font-size:14px;">
            Forgot Password?
        </span>
    </p>

    <button id="login-btn">Sign In</button>

    <p>Don't have an account?
        <span id="show-signup" style="cursor:pointer; color:blue;">Sign Up</span>
    </p>

    <p class="message" id="login-message"></p>
</div>
<!--Reset Password-->
<div class="container" id="forgot-screen" style="display:none;">
    <h1>Reset Password</h1>
    <input type="email" id="forgot-email" placeholder="Enter your email" required>
    <input type="password" id="new-password" placeholder="Enter new password" required>
    <button id="reset-btn">Send Reset Link</button>

    <p>
        <span id="back-to-login" style="cursor:pointer; color:blue;">
            Back to Login
        </span>
    </p>

    <p class="message" id="forgot-message"></p>
</div>


    <!-- TO-DO LIST SCREEN -->
    <div class="container" id="todo-screen" style="display:none;">
        <h1 id="todo-welcome"></h1>
        <div class="input-section">
            <input type="text" id="todo-input" placeholder="Add a new task...">
            <button id="add-btn">Add</button>
        </div>
        <ul id="todo-list"></ul>
        <button id="logout-btn" style="margin-top:20px;">Logout</button>
    </div>

    <script src="script.js"></script>
</body>
